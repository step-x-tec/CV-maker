[build]
  publish = "public"

# L'URL et la clé "anon" Supabase sont PUBLIQUES par conception (elles doivent figurer dans
# public/config.js). On les exclut du scan de secrets de Netlify. La clé service_role,
# elle, reste surveillée : elle ne doit jamais apparaître dans le dépôt.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/cv/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
