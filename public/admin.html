<!DOCTYPE html>
<html lang="fr">
<head>
<script>window.__H0=(location.hash||'').slice(1);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVxMaker — Administration</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<script src="config.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B1220;--panel:#131C2E;--panel2:#1C2740;--panel3:#26334F;--ink:#F1F5F9;--ink2:#94A3B8;--ink3:#64748B;--accent:#3B82F6;--accent2:#2563EB;--ok:#10B981;--warn:#F59E0B;--bad:#EF4444;--vio:#8B5CF6;--border:rgba(255,255,255,.08);--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:11.5px}
.app{display:flex;height:100vh;height:100dvh}
/* ── Menu latéral ── */
.side{width:232px;background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;transition:transform .2s}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:800;font-size:15px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand em{font-style:normal;color:var(--accent)}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 10px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:none;background:none;color:var(--ink2);border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:1px;cursor:pointer}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.active{background:var(--accent2);color:#fff}
.nav-item .ic{width:18px;text-align:center}
.nav-item .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--ink2)}
.side-foot b{color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ── Zone principale ── */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--panel);position:relative}
.top .burger{display:none;background:var(--panel2);border:none;border-radius:8px;padding:7px 10px;cursor:pointer}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);background:var(--bg)}
.search:before{content:"🔍";position:absolute;left:11px;top:8px;font-size:13px;opacity:.6}
.search kbd{position:absolute;right:9px;top:8px;font-size:10px;color:var(--ink3);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.sres{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:70vh;overflow:auto;z-index:50;display:none}
.sres h5{margin:0;padding:9px 12px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.sres a{display:block;padding:8px 12px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:12.5px}
.sres a:hover{background:var(--panel2)}
.sres a small{color:var(--ink2);margin-left:6px}
.main{flex:1;overflow-y:auto;padding:22px 26px 60px}
.main>.wrap{max-width:1500px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{margin:0;font-size:21px;font-weight:800}
.ph p{margin:3px 0 0;color:var(--ink2);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ── Composants ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--ink2);font-weight:500;font-size:11px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-21{grid-template-columns:2fr 1fr}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent)}
.kpi .l{font-size:11px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.kpi .d{font-size:11px;margin-top:2px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--ink3)}
.kpi svg{position:absolute;right:8px;bottom:6px;opacity:.55}
.btn{padding:7px 12px;border-radius:9px;border:1px solid transparent;font-size:12px;font-weight:600;cursor:pointer;background:var(--panel2);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn.pri{background:var(--accent2);color:#fff}.btn.pri:hover{background:var(--accent)}
.btn.danger{background:#3B1A1F;color:#FCA5A5}.btn.danger:hover{background:#5A1F27}
.btn.ok{background:#0F3A2C;color:#6EE7B7}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:7px}
.btn[disabled]{opacity:.4;pointer-events:none}
input.f,select.f,textarea.f{padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);min-width:0}
input.f:focus,select.f:focus,textarea.f:focus,.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.f{width:100%;min-height:90px;resize:vertical}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;background:var(--panel3);color:var(--ink)}
.b-free{background:#334155}.b-starter{background:#1D4ED8}.b-premium{background:#7C3AED}.b-pro{background:#B45309}
.b-ok{background:#064E3B;color:#6EE7B7}.b-bad{background:#4C1D1D;color:#FCA5A5}.b-warn{background:#4A3410;color:#FCD34D}.b-info{background:#1E3A5F;color:#93C5FD}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--ink2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--panel)}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr.clk{cursor:pointer}
tr:last-child td{border-bottom:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.muted{color:var(--ink2)}.small{font-size:11.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;color:var(--ink2);font-size:12px;flex-wrap:wrap}
.stub{background:var(--panel);border:1px dashed var(--border);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink2)}
.err{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:none;color:var(--ink2);padding:9px 14px;font-weight:600;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--accent2);color:#fff;border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.list-item:last-child{border-bottom:none}
.bar{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);background:var(--panel2)}
.alert:hover{border-color:var(--accent)}
.alert.bad{background:#2E1519;border-color:#5A1F27}.alert.warn{background:#2C2410;border-color:#4A3A12}.alert.ok{background:#0F2A22;border-color:#14503C;cursor:default}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
/* ── Tiroir / modale / toasts ── */
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(2px);z-index:80;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--panel);border-left:1px solid var(--border);z-index:81;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.drawer .dh h3{margin:0;font-size:15px}
.drawer .db{flex:1;overflow-y:auto;padding:16px 18px 40px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;z-index:90;padding:20px;display:none;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(900px,96vw)}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{background:var(--panel3);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .2s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* ── Connexion ── */
.login-box{max-width:360px;margin:9vh auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px}
.login-box img{width:46px;height:46px;border-radius:12px}
.login-box input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);margin-bottom:10px}
.login-box .go{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent2);color:#fff;font-weight:700;cursor:pointer}
/* ── Graphiques ── */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bubble{padding:9px 12px;border-radius:12px;max-width:85%;font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.b-user{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:4px}
.b-admin{background:var(--accent2);align-self:flex-end;border-bottom-right-radius:4px}
.cv-prev{background:#fff;color:#111;border-radius:10px;padding:22px;font-size:12px;line-height:1.5}
.cv-prev h1{font-size:20px;margin:0}.cv-prev h4{margin:14px 0 4px;border-bottom:2px solid #ddd;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-21,.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{position:fixed;z-index:70;top:0;bottom:0;left:0;transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .top .burger{display:block}.top{padding:10px 14px}.search kbd{display:none}.search{max-width:none}
  .main{padding:16px 14px 70px}.g2,.g3,.g4{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <div class="row" style="margin-bottom:6px"><img src="icons/logo-96.png" alt=""><div><h2 style="margin:0;font-size:19px">Admin CVxMaker</h2><div class="muted small">Espace réservé aux administrateurs</div></div></div>
  <div id="loginErr" class="err small" style="display:none;margin:12px 0 0"></div>
  <div style="height:14px"></div>
  <input id="admEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="admPass" type="password" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
  <button class="go" onclick="adminLogin()">Se connecter</button>
  <div style="text-align:center;margin-top:12px"><a href="#" class="small" onclick="adminForgot();return false">Mot de passe oublié ?</a></div>
</div>

<div id="adminApp" class="app" style="display:none">
  <aside class="side" id="side">
    <div class="brand"><img src="icons/logo-96.png" alt=""><span>CVx<em>Maker</em> Admin</span></div>
    <div id="nav"></div>
    <div class="side-foot"><b id="meName">—</b><span id="meRole" class="small"></span><div style="margin-top:8px"><button class="btn sm" onclick="adminLogout()">↪ Déconnexion</button></div></div>
  </aside>
  <div class="col">
    <div class="top">
      <button class="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="search"><input id="gq" placeholder="Rechercher un utilisateur, un CV, une transaction, un ticket…" oninput="globalSearch(this.value)" onfocus="globalSearch(this.value)" autocomplete="off"><kbd>Ctrl K</kbd><div class="sres" id="sres"></div></div>
      <div style="flex:1"></div>
      <span id="sessInfo" class="muted small"></span>
      <button class="btn sm" onclick="refreshPage()" title="Actualiser">⟳</button>
    </div>
    <div class="main" id="main"><div class="wrap" id="mainArea"></div></div>
  </div>
</div>

<div class="ov" id="ov" onclick="closeAll()"></div>
<aside class="drawer" id="drawer"><div class="dh"><h3 id="drawerTitle"></h3><button class="btn sm" onclick="closeAll()">✕</button></div><div class="db" id="drawerBody"></div></aside>
<div class="modal" id="modal"></div>
<div id="toasts"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   SÉCURITÉ : ce tableau de bord n'utilise QUE la clé anon (jamais service_role).
   Chaque action sensible passe par une fonction Postgres SECURITY DEFINER qui
   vérifie le RÔLE de l'appelant en base (viewer < moderator < admin < superadmin).
   Les boutons masqués côté navigateur ne sont qu'un confort : le vrai contrôle
   est dans la base (voir supabase/migrations/20261017000000_admin_suite.sql).
   ═══════════════════════════════════════════════════════════════════════ */
const CFG = window.__SC_CONFIG__ || {};
const SUPABASE_URL = (CFG.SUPABASE_URL || '').replace(/\/+$/,'');
const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || '';
const CONFIG_OK = /^https:\/\/[a-z0-9]{12,}\.supabase\.co$/.test(SUPABASE_URL) && /^(eyJ|sb_publishable_)/.test(SUPABASE_ANON_KEY);
if (!CONFIG_OK) console.error('[CVxMaker] Configuration manquante : renseignez SUPABASE_URL et SUPABASE_ANON_KEY dans /config.js');
if(!CONFIG_OK){ document.addEventListener('DOMContentLoaded',function(){ document.body.innerHTML='<div style="font-family:sans-serif;color:#fff;padding:40px;max-width:560px;margin:auto"><h2>Espace indisponible</h2><p>L\'espace d\'administration est momentanément indisponible. Réessayez dans quelques instants.</p></div>'; }); throw new Error('config.js non renseigné'); }
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
/* Traduit toute erreur technique en message clair pour l'utilisateur (le détail reste en console). */
function userMsg(e, fallback){
  const raw=String((e&&e.message)||e||''); try{ console.warn('[CVxMaker]', e); }catch(_){}
  const m=raw.toLowerCase();
  if(/failed to fetch|networkerror|load failed|network request failed|timeout|timed out|offline/.test(m)) return 'Connexion impossible. Vérifiez votre connexion Internet puis réessayez.';
  if(/jwt|not authenticated|auth session missing|invalid token|refresh token/.test(m)) return 'Votre session a expiré. Reconnectez-vous puis réessayez.';
  if(/permission denied|row-level security|forbidden|42501|not allowed|droits insuffisants/.test(m)) return "Vous n'avez pas l'autorisation d'effectuer cette action.";
  if(/rate limit|too many/.test(m)) return 'Trop de tentatives. Patientez quelques minutes puis réessayez.';
  if(/could not find the function|schema cache|does not exist|undefined_table|pgrst|relation .* does not exist|column .* does not exist/.test(m)) return 'Ce service est momentanément indisponible. Réessayez dans quelques instants.';
  if(/duplicate key|already exists/.test(m)) return 'Cet élément existe déjà.';
  if(/invalid input|violates|check constraint|value too long|invalid uuid/.test(m)) return 'Certaines informations saisies ne sont pas valides. Vérifiez-les puis réessayez.';
  if(raw && raw.length<160 && !/supabase|postgres|sql|rpc|jwt|function|column|relation|constraint|syntax|violates|undefined|null value|[a-z_]+\.[a-z_]+|[{}\[\]]/i.test(raw)) return raw;
  return fallback || 'Une erreur est survenue. Réessayez dans un instant.';
}

let admin = null;           // profil de l'admin connecté
const RANK = { viewer:1, moderator:2, admin:3, superadmin:4 };
const ROLE_FR = { viewer:'Lecture seule', moderator:'Modérateur', admin:'Administrateur', superadmin:'Super-admin' };
function myRank(){ return admin && admin.is_admin ? (RANK[admin.admin_role||'admin']||3) : 0; }
function can(min){ return myRank() >= min; }

/* ── utilitaires ── */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);
const nf = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR');
const money = n => nf(n) + ' FCFA';
const fdate = d => d ? new Date(d).toLocaleDateString('fr-FR') : '—';
const fdt = d => d ? new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
function ago(d){ if(!d) return '—'; const s=(Date.now()-new Date(d))/1000; if(s<60) return 'à l\'instant'; if(s<3600) return Math.floor(s/60)+' min'; if(s<86400) return Math.floor(s/3600)+' h'; if(s<86400*30) return Math.floor(s/86400)+' j'; return fdate(d); }
function delta(cur, prev){ if(!prev) return cur ? '<span class="d up">▲ nouveau</span>' : '<span class="d flat">—</span>'; const p=Math.round((cur-prev)/prev*100); return '<span class="d '+(p>0?'up':p<0?'down':'flat')+'">'+(p>0?'▲ +':p<0?'▼ ':'= ')+p+'% vs période préc.</span>'; }
function bytes(n){ if(n==null) return '—'; const u=['o','Ko','Mo','Go']; let i=0; while(n>=1024&&i<3){ n/=1024; i++; } return n.toFixed(i?1:0)+' '+u[i]; }
function planBadge(p){ return '<span class="badge b-'+esc(p||'free')+'">'+esc(p||'free')+'</span>'; }
function statusBadge(s){ const m={success:'b-ok',approved:'b-ok',resolved:'b-ok',active:'b-ok',pending:'b-warn',processing:'b-info',open:'b-warn',in_progress:'b-info',waiting_user:'b-info',failed:'b-bad',rejected:'b-bad',revoked:'b-bad',refunded:'b-bad',disputed:'b-bad',used:'b-info',closed:''}; return '<span class="badge '+(m[s]||'')+'">'+esc(s)+'</span>'; }
function toast(msg, type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg; $('toasts').appendChild(t); setTimeout(()=>t.remove(), type==='bad'?6000:3200); }
function csvDownload(name, head, rows){
  const cell = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const txt = '\ufeff'+[head].concat(rows).map(r=>r.map(cell).join(',')).join('\n');

async function rpc(name, args){
  const { data, error } = await sb.rpc(name, args||{});
  if(error) throw error;
  if(data && data.error === 'FORBIDDEN') throw new Error('Droits insuffisants');
  return data;
}
async function act(fn, okMsg){          // exécute une action, affiche un toast, renvoie true/false
  try{ const r = await fn(); if(okMsg) toast(okMsg,'ok'); return r===undefined?true:r; }
  catch(e){ toast(userMsg(e), 'bad'); return false; }
}

/* déconnexion automatique après 30 min d'inactivité */
function idleWatch(){
  let last = Date.now(); ['click','keydown','mousemove','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ last=Date.now(); },{passive:true}));
  setInterval(()=>{ const m=Math.floor((Date.now()-last)/60000); if(m>=30){ adminLogout(); } else if(m>=25){ $('sessInfo').textContent='Déconnexion dans '+(30-m)+' min'; } else $('sessInfo').textContent=''; }, 30000);
}
/* ── graphiques SVG (sans dépendance) ── */
const PAL = ['#3B82F6','#10B981','#F59E0B','#8B5CF6','#EF4444','#06B6D4','#EC4899','#84CC16'];
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function lineChart(series, opts){
  opts = opts||{}; const color = opts.color||PAL[0], H = opts.h||150, W = 560, padL=34, padB=18, padT=8;
  if(!series || !series.length) return '<div class="stub small">Pas de données.</div>';
  const vals = series.map(s=>+s.v||0), mx = niceMax(Math.max.apply(null, vals)), n = series.length;
  const x = i => padL + (n===1?0:(i*(W-padL-6)/(n-1))), y = v => padT + (H-padT-padB) * (1 - v/mx);
  const pts = vals.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  const area = 'M'+x(0)+','+y(0)+' L'+pts.join(' L')+' L'+x(n-1)+','+y(0)+' Z';
  let grid=''; for(let g=0; g<=3; g++){ const v=mx*g/3, yy=y(v); grid+='<line x1="'+padL+'" x2="'+(W-6)+'" y1="'+yy+'" y2="'+yy+'" stroke="rgba(255,255,255,.07)"/><text x="'+(padL-5)+'" y="'+(yy+3)+'" text-anchor="end">'+(opts.money?nf(Math.round(v/1000))+'k':nf(Math.round(v)))+'</text>'; }
  const step = Math.max(1, Math.ceil(n/6)); let xl=''; for(let i=0;i<n;i+=step){ xl+='<text x="'+x(i)+'" y="'+(H-4)+'" text-anchor="middle">'+series[i].d.slice(8,10)+'/'+series[i].d.slice(5,7)+'</text>'; }
  const id='g'+Math.random().toString(36).slice(2,7);
  const hit = vals.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(n>45?2:3)+'" fill="'+color+'"><title>'+series[i].d+' : '+(opts.money?money(v):nf(v))+'</title></circle>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".35"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+grid+xl+'<path d="'+area+'" fill="url(#'+id+')"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+hit+'</svg>';
}
function spark(series, color){
  if(!series || series.length<2) return ''; const W=70,H=26, vals=series.map(s=>+s.v||0), mx=Math.max.apply(null,vals)||1;
  const pts = vals.map((v,i)=>(i*W/(vals.length-1)).toFixed(1)+','+(H-2-(H-4)*v/mx).toFixed(1)).join(' ');
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><polyline points="'+pts+'" fill="none" stroke="'+(color||PAL[0])+'" stroke-width="1.6"/></svg>';
}
function donut(items){          // items: [{id,n}]
  const tot = items.reduce((a,b)=>a+b.n,0); if(!tot) return '<div class="stub small">Aucune donnée.</div>';
  let acc=0; const R=42, C=2*Math.PI*R;
  const arcs = items.map((it,i)=>{ const f=it.n/tot, len=f*C, o=-acc*C; acc+=f; return '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+o+'" transform="rotate(-90 60 60)"><title>'+esc(it.id)+' : '+it.n+'</title></circle>'; }).join('');
  return '<div class="row" style="gap:18px;align-items:center"><svg width="120" height="120" viewBox="0 0 120 120">'+arcs+'<text x="60" y="58" text-anchor="middle" style="fill:var(--ink);font-size:18px;font-weight:800">'+nf(tot)+'</text><text x="60" y="73" text-anchor="middle" style="font-size:9px">total</text></svg><div class="legend" style="flex-direction:column;gap:5px;margin:0">'+items.map((it,i)=>'<span><i style="background:'+PAL[i%PAL.length]+'"></i>'+esc(it.id)+' · <b style="color:var(--ink)">'+nf(it.n)+'</b> ('+Math.round(it.n/tot*100)+'%)</span>').join('')+'</div></div>';
}
function bars(items, opts){     // items: [{id,n}]
  opts=opts||{}; if(!items || !items.length) return '<div class="stub small">Aucune donnée.</div>';
  const mx = Math.max.apply(null, items.map(i=>i.n))||1;
  return items.map((it,i)=>'<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+esc(opts.label?opts.label(it):it.id)+'</span><b>'+nf(it.n)+'</b></div><div class="bar"><i style="width:'+Math.max(3,it.n/mx*100)+'%;background:'+PAL[(opts.color!=null?opts.color:i)%PAL.length]+'"></i></div></div>').join('');
}

let LIC_F = 'all';
function randKey(plan){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(12); crypto.getRandomValues(b); return 'SC-'+plan.toUpperCase()+'-'+Array.from(b,x=>A[x%A.length]).join(''); }
async function genLicenses(){
  const plan=$('licPlan').value, n=Math.max(1,Math.min(100,parseInt($('licCount').value)||1)), days=Math.max(1,parseInt($('licDays').value)||30), note=$('licNote').value.trim()||null;
  const rows=Array.from({length:n},()=>({key:randKey(plan),plan,duration_days:days,max_uses:1,created_by:admin.id,note}));
  const { error } = await sb.from('license_keys').insert(rows);
  if(error) return toast(userMsg(error),'bad');
  await sb.rpc('admin_log',{p_action:'license.generate',p_type:'license',p_id:null,p_data:{plan,count:n,days,note}});
  $('licOut').textContent = rows.map(r=>r.key).join('\n'); toast(n+' clé(s) générée(s)','ok'); loadLicenses();
}
async function loadLicenses(){
  try{
    let q = sb.from('license_keys').select('key,plan,duration_days,status,used_at,used_by,note,created_at').order('created_at',{ascending:false}).limit(300);
    if(LIC_F!=='all') q=q.eq('status',LIC_F);
    const { data, error } = await q; if(error) throw error; LICS=data;
    const users = {}; const ids=[...new Set(data.map(k=>k.used_by).filter(Boolean))];
    if(ids.length){ const u=await sb.from('profiles').select('id,email').in('id',ids); (u.data||[]).forEach(x=>users[x.id]=x.email); }
    $('licList').innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Clé</th><th>Plan</th><th>Durée</th><th>Statut</th><th>Utilisée par</th><th>Note</th><th>Créée</th><th></th></tr></thead><tbody>'
      + (data.map(k=>'<tr><td class="mono">'+esc(k.key)+' <button class="btn sm" onclick="navigator.clipboard.writeText(\''+esc(k.key)+'\');toast(\'Copié\',\'ok\')">⧉</button></td><td>'+planBadge(k.plan)+'</td><td>'+k.duration_days+' j</td><td>'+statusBadge(k.status)+'</td><td class="muted small">'+(k.used_by?esc(users[k.used_by]||k.used_by)+'<br>'+fdate(k.used_at):'—')+'</td><td class="muted small">'+esc(k.note||'')+'</td><td class="muted small">'+fdate(k.created_at)+'</td><td>'+(can(3)&&k.status==='active'?'<button class="btn sm danger" onclick="revokeLicense(\''+esc(k.key)+'\')">Révoquer</button>':'')+'</td></tr>').join('')||'<tr><td colspan="8" class="muted" style="text-align:center;padding:26px">Aucune clé.</td></tr>')
      + '</tbody></table></div>';
  }catch(e){ $('licList').innerHTML = errBox(e); }
}
function exportLicCsv(){ csvDownload('licences',['Clé','Plan','Durée (j)','Statut','Utilisée le','Note','Créée'], LICS.map(k=>[k.key,k.plan,k.duration_days,k.status,k.used_at,k.note,k.created_at])); }
function revokeLicense(key){ ask('Révoquer cette clé','<span class="mono">'+esc(key)+'</span>','Révoquer',async()=>{ const { error } = await sb.from('license_keys').update({status:'revoked'}).eq('key',key); if(error){ toast(userMsg(error),'bad'); return false; } sb.rpc('admin_log',{p_action:'license.revoke',p_type:'license',p_id:key}); toast('Clé révoquée','ok'); loadLicenses(); }, true); }

  const { data, error } = await sb.from('profiles').select('id,email').ilike('email',email).limit(1); if(error) return toast(userMsg(error),'bad');
  if(!data||!data.length) return toast('Aucun compte avec cet email. La personne doit d\'abord s\'inscrire.','bad');
  ask('Donner l\'accès admin','Accorder le rôle <b>'+esc(ROLE_FR[$('newRole').value])+'</b> à <b>'+esc(data[0].email)+'</b> ?','Confirmer',async()=>{ const ok=await act(()=>rpc('admin_set_admin',{p_user:data[0].id,p_is_admin:true,p_role:$('newRole').value}),'Membre ajouté'); if(ok) goPage('settings',{tab:'team'}); else return false; });
}
async function setData(){
  $('setBody').innerHTML = '<div class="grid g2"><div class="card"><h3>📦 Exports de données</h3><p class="muted small">Téléchargez des sauvegardes lisibles (CSV) des tables principales.</p><div class="row"><button class="btn" onclick="backupCsv(\'users\')">Utilisateurs</button><button class="btn" onclick="backupCsv(\'payments\')">Paiements</button><button class="btn" onclick="backupCsv(\'cvs\')">CV (métadonnées)</button></div><p class="muted small" style="margin-top:10px">Pour une sauvegarde complète de la base, utilisez les sauvegardes automatiques de Supabase (Database → Backups).</p></div>'
    + '<div class="card"><h3>🧹 Maintenance</h3><p class="muted small">Rétrograde au plan gratuit les comptes dont l\'abonnement a expiré.</p><button class="btn" '+(can(3)?'':'disabled')+' onclick="expirePlans()">Rétrograder les plans expirés</button><p class="muted small" style="margin-top:14px">Vue d\'ensemble technique : <a style="cursor:pointer" onclick="goPage(\'activity\')">Activité & santé</a></p></div></div>';
}
async function backupCsv(kind){
  toast('Préparation…');
  try{
    if(kind==='users'){ const r=await rpc('admin_list_users',{p_q:'',p_plan:'all',p_status:'all',p_sort:'created_at',p_dir:'desc',p_limit:200,p_offset:0}); csvDownload('sauvegarde-utilisateurs',['ID','Nom','Email','Téléphone','Plan','Expire','Inscrit'],r.rows.map(u=>[u.id,u.name,u.email,u.phone,u.plan,u.plan_expires_at,u.created_at])); if(r.total>200) toast('200 premiers sur '+r.total+' (limite d\'export navigateur).'); }
    else if(kind==='payments'){ exportPaymentsCsv(); }
    else { const r=await rpc('admin_list_cvs',{p_q:'',p_vis:'all',p_limit:200,p_offset:0}); csvDownload('sauvegarde-cv',['ID','Titre','Propriétaire','Modèle','Public','Vues','Créé'],r.rows.map(c=>[c.id,c.title,c.owner_email,c.model_id,c.is_public,c.view_count,c.created_at])); }
  }catch(e){ toast(userMsg(e),'bad'); }
}
function setMe(){
  $('setBody').innerHTML = '<div class="card" style="max-width:460px"><h3>Changer mon mot de passe</h3><input class="f" id="pw1" type="password" placeholder="Nouveau mot de passe (8 caractères min.)" style="width:100%;margin-bottom:8px" autocomplete="new-password"><input class="f" id="pw2" type="password" placeholder="Confirmer" style="width:100%;margin-bottom:10px" autocomplete="new-password"><button class="btn pri" onclick="changePw()">Mettre à jour</button><p class="muted small" style="margin-top:14px">Connecté en tant que <b>'+esc(admin.email)+'</b> · '+esc(ROLE_FR[admin.admin_role||'admin'])+'. Déconnexion automatique après 30 min d\'inactivité.</p></div>';
}
async function changePw(){
  const a=$('pw1').value, b=$('pw2').value; if(a.length<8) return toast('8 caractères minimum','bad'); if(a!==b) return toast('Les mots de passe diffèrent','bad');
  const { error } = await sb.auth.updateUser({password:a}); if(error) return toast(userMsg(error),'bad'); toast('Mot de passe mis à jour','ok'); $('pw1').value=$('pw2').value='';
}
