# Configuration minimale pour `supabase functions deploy`
project_id = "cvxmaker"

# CinetPay appelle ce webhook de serveur à serveur : il ne peut pas envoyer de JWT Supabase.
# La sécurité vient de la re-vérification du paiement auprès de CinetPay + du montant enregistré en base.
[functions.cinetpay-webhook]
verify_jwt = false

[functions.create-payment]
verify_jwt = true

[functions.ai-chat]
verify_jwt = true

# ── E-mails d'authentification (modèles CVxMaker) ──
# Utilisés en local et par `supabase config push`. Sur Supabase Cloud, vous pouvez aussi les coller à la main
# (voir supabase/templates/LISEZ-MOI.md).
[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail — CVxMaker"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe CVxMaker"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion CVxMaker"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse e-mail — CVxMaker"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Vous êtes invité(e) sur CVxMaker"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Votre code de vérification CVxMaker"
content_path = "./supabase/templates/reauthentication.html"

